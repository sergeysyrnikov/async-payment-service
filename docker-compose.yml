services:
  # Main FastAPI application
  async_payment_service:
    image: async_payment_service:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://guest:guest@async_payment_service_rabbitmq:5672/
    volumes:
      - .:/app
    depends_on:
      async_payment_service_migrations:
        condition: service_completed_successfully
      async_payment_service_rabbitmq:
        condition: service_healthy
    networks:
      - async_payment_service_network

  async_payment_service_migrations:
    image: async_payment_service:latest
    command: ["uv", "run", "alembic",  "upgrade", "head"]
    env_file:
      - .env
    volumes:
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      async_payment_service_postgres:
        condition: service_healthy
    networks:
      - async_payment_service_network

  # RabbitMQ consumer (payment processing)
  async_payment_service_consumer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["uv", "run", "python", "-m", "app.consumer"]
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://guest:guest@async_payment_service_rabbitmq:5672/
      # локальный TUN-прокси машины перехватывает исходящий httpx и отдаёт 502
      # на webhook-запросы — исключаем их из проксирования
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal
      - no_proxy=localhost,127.0.0.1,host.docker.internal
    volumes:
      - .:/app
    depends_on:
      async_payment_service_migrations:
        condition: service_completed_successfully
      async_payment_service_rabbitmq:
        condition: service_healthy
    networks:
      - async_payment_service_network
    restart: unless-stopped

  # DB service
  async_payment_service_postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      - PGPORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5444:${POSTGRES_PORT}"
    volumes:
      - async_payment_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - async_payment_service_network
    restart: unless-stopped

  # RabbitMQ service
  async_payment_service_rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - async_payment_service_network
    restart: unless-stopped


volumes:
  async_payment_service_postgres_data:

networks:
  async_payment_service_network:
    name: async_payment_service_network
    external: true
